<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: black; overflow: hidden; touch-action: none; user-select: none; }
        #root { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        // Firebase Config
        const firebaseConfig = {
          apiKey: "AIzaSyBHnQxGTZXvSlJj77TWGFJLpPRQm6n_xOU",
          authDomain: "msg-jaan.firebaseapp.com",
          databaseURL: "https://msg-jaan-default-rtdb.firebaseio.com",
          projectId: "msg-jaan",
          storageBucket: "msg-jaan.firebasestorage.app",
          messagingSenderId: "188484227989",
          appId: "1:188484227989:web:9e4ddf981d8f71a3ea9c9c"
        };

        // Telegram Config
        const telegramConfig = {
            botToken: "8866413029:AAEfY0jx9xzoDEc1bMoY9vsBevLLBMkjP2k", 
            chatId: "8831398352"     
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const { useState, useEffect, useRef } = React;

        function App() {
            const [screen, setScreen] = useState('password');
            const [password, setPassword] = useState('');
            const [display, setDisplay] = useState('0');
            const [prevValue, setPrevValue] = useState(null);
            const [operator, setOperator] = useState(null);
            const [waitingForNewValue, setWaitingForNewValue] = useState(false);
            
            const [messages, setMessages] = useState([]);
            const [messageInput, setMessageInput] = useState('');
            const [callStatus, setCallStatus] = useState(null); 
            const [callType, setCallType] = useState('');
            
            const chatEndRef = useRef(null);

            const sendTelegramAlert = (text) => {
                const msg = encodeURIComponent(text);
                const url = `https://api.telegram.org/bot${telegramConfig.botToken}/sendMessage?chat_id=${telegramConfig.chatId}&text=${msg}&parse_mode=Markdown`;
                fetch(url).catch(err => console.log(err));
            };

            useEffect(() => {
                if (screen === 'chat') {
                    sendTelegramAlert("🚨 *Alert:* Jaan online aa gayi hai! Chat screen open ho chuki hai. ❤️");

                    const messagesRef = db.ref('messages');
                    messagesRef.on('value', (snapshot) => {
                        const data = snapshot.val();
                        if (data) {
                            setMessages(Object.keys(data).map(key => data[key]));
                        } else {
                            setMessages([]); 
                        }
                    });

                    const callRef = db.ref('currentCall');
                    callRef.on('value', (snapshot) => {
                        const callData = snapshot.val();
                        if (callData && callData.status === 'active') {
                            if (callData.by === 'admin') {
                                setCallStatus('incoming');
                                setCallType(callData.type);
                            }
                        } else {
                            setCallStatus(null);
                        }
                    });

                    return () => { messagesRef.off(); callRef.off(); };
                }
            }, [screen]);

            useEffect(() => { chatEndRef.current?.scrollIntoView({ behavior: "smooth" }); }, [messages]);

            const handlePasswordSubmit = (e) => {
                e.preventDefault();
                if (password.toLowerCase() === "jaan") { 
                    setScreen('calculator'); 
                }
                setPassword('');
            };

            const inputDigit = (digit) => {
                if (waitingForNewValue) { 
                    setDisplay(String(digit)); 
                    setWaitingForNewValue(false); 
                } else { 
                    setDisplay(display === '0' ? String(digit) : display + String(digit)); 
                }
            };

            // Real Mathematical Calculation Logic
            const calculateResult = (first, second, op) => {
                switch(op) {
                    case '+': return first + second;
                    case '-': return first - second;
                    case '×': return first * second;
                    case '÷': return second !== 0 ? first / second : 'Error';
                    default: return second;
                }
            };

            const handleEquals = () => {
                if (display === '143') { 
                    setScreen('chat'); 
                    clear(); 
                    return; 
                }
                
                if (operator && prevValue !== null) {
                    const currentVal = parseFloat(display);
                    const result = calculateResult(prevValue, currentVal, operator);
                    setDisplay(String(result));
                    setPrevValue(null);
                    setOperator(null);
                    setWaitingForNewValue(true);
                }
            };

            const performOperation = (nextOperator) => {
                const inputValue = parseFloat(display);
                
                if (prevValue === null) { 
                    setPrevValue(inputValue); 
                } else if (operator && !waitingForNewValue) {
                    const result = calculateResult(prevValue, inputValue, operator);
                    setPrevValue(result);
                    setDisplay(String(result));
                }
                
                setWaitingForNewValue(true); 
                setOperator(nextOperator);
            };

            const clear = () => { 
                setDisplay('0'); 
                setPrevValue(null); 
                setOperator(null); 
                setWaitingForNewValue(false); 
            };

            const sendMessage = () => {
                const textToSend = messageInput.trim();
                if (!textToSend) return;
                db.ref('messages').push({
                    sender: 'user',
                    type: 'text',
                    content: textToSend,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
                sendTelegramAlert(`📩 *Naya Message:* ${textToSend}`);
                setMessageInput('');
            };

            const startCall = (type) => {
                setCallStatus('outgoing');
                setCallType(type);
                db.ref('currentCall').set({ status: 'active', type: type, by: 'user' });
                sendTelegramAlert(`📞 *Call Alert:* Wo aapko ${type} Call milane ki koshish kar rahi hai!`);
            };

            const endCall = () => { setCallStatus(null); db.ref('currentCall').remove(); };

            // Kahin par bhi double click karne par safe exit handler
            const handleAnywhereDoubleClick = () => {
                db.ref('messages').remove();
                db.ref('currentCall').remove();
                sendTelegramAlert("🔒 *Safe Exit:* Screen par double click karke chat ko secure kiya gaya.");
                setScreen('calculator');
                clear();
            };

            if (screen === 'password') {
                return (
                    <div className="h-full w-full bg-black flex items-center justify-center">
                        <form onSubmit={handlePasswordSubmit} className="flex flex-col items-center gap-6">
                            <i className="fas fa-lock text-5xl text-neutral-600"></i>
                            <input type="password" value={password} onChange={(e) => setPassword(e.target.value)}
                                className="bg-transparent border-b border-neutral-800 text-white text-center text-2xl px-4 py-2 focus:outline-none" placeholder="Passcode" autoFocus />
                        </form>
                    </div>
                );
            }

            if (screen === 'calculator') {
                return (
                    <div className="h-full w-full bg-black flex flex-col justify-end p-4 pb-10 max-w-sm mx-auto">
                        <div className="text-white text-7xl font-light text-right mb-6 px-4 truncate">{display}</div>
                        <div className="grid grid-cols-4 gap-3 w-full">
                            <button type="button" onClick={clear} className="bg-neutral-400 text-black text-3xl font-normal aspect-square rounded-full flex items-center justify-center">AC</button>
                            <button type="button" onClick={() => setDisplay(String(parseFloat(display) * -1))} className="bg-neutral-400 text-black text-3xl font-normal aspect-square rounded-full flex items-center justify-center">±</button>
                            <button type="button" onClick={() => setDisplay(String(parseFloat(display) / 100))} className="bg-neutral-400 text-black text-3xl font-normal aspect-square rounded-full flex items-center justify-center">%</button>
                            <button type="button" onClick={() => performOperation('÷')} className="bg-orange-500 text-white text-4xl font-normal aspect-square rounded-full flex items-center justify-center">÷</button>
                            {[7, 8, 9].map(num => <button type="button" key={num} onClick={() => inputDigit(num)} className="bg-neutral-800 text-white text-3xl font-normal aspect-square rounded-full flex items-center justify-center">{num}</button>)}
                            <button type="button" onClick={() => performOperation('×')} className="bg-orange-500 text-white text-4xl font-normal aspect-square rounded-full flex items-center justify-center">×</button>
                            {[4, 5, 6].map(num => <button type="button" key={num} onClick={() => inputDigit(num)} className="bg-neutral-800 text-white text-3xl font-normal aspect-square rounded-full flex items-center justify-center">{num}</button>)}
                            <button type="button" onClick={() => performOperation('-')} className="bg-orange-500 text-white text-4xl font-normal aspect-square rounded-full flex items-center justify-center">−</button>
                            {[1, 2, 3].map(num => <button type="button" key={num} onClick={() => inputDigit(num)} className="bg-neutral-800 text-white text-3xl font-normal aspect-square rounded-full flex items-center justify-center">{num}</button>)}
                            <button type="button" onClick={() => performOperation('+')} className="bg-orange-500 text-white text-4xl font-normal aspect-square rounded-full flex items-center justify-center">+</button>
                            <button type="button" onClick={() => inputDigit(0)} className="bg-neutral-800 text-white text-3xl font-normal rounded-full flex items-center justify-start pl-8 col-span-2">0</button>
                            <button type="button" onClick={() => { if (!display.includes('.')) setDisplay(display + '.'); }} className="bg-neutral-800 text-white text-3xl font-normal aspect-square rounded-full flex items-center justify-center">.</button>
                            <button type="button" onClick={handleEquals} className="bg-orange-500 text-white text-4xl font-normal aspect-square rounded-full flex items-center justify-center">=</button>
                        </div>
                    </div>
                );
            }

            if (screen === 'chat') {
                return (
                    /* SCREEN PAR KAHIN BHI DOUBLE CLICK KARNE SE EXIT HO JAYEGA */
                    <div onDoubleClick={handleAnywhereDoubleClick} className="h-full w-full bg-black flex flex-col relative select-none">
                        {callStatus && (
                            <div className="absolute inset-0 bg-neutral-900 z-50 flex flex-col items-center justify-between p-12 text-white">
                                <div className="text-center mt-10">
                                    <div className="w-24 h-24 bg-blue-600 rounded-full mx-auto flex items-center justify-center text-4xl font-bold mb-4">M</div>
                                    <h2 className="text-2xl font-semibold">My Love</h2>
                                    <p className="text-sm text-neutral-400 mt-2 animate-pulse">{callStatus === 'incoming' ? `Incoming ${callType} Call...` : `Ringing (${callType} Call)...`}</p>
                                </div>
                                <div className="flex gap-10 mb-10">
                                    {callStatus === 'incoming' && <button onClick={(e) => { e.stopPropagation(); setCallStatus('connected'); }} className="w-16 h-16 bg-green-500 rounded-full flex items-center justify-center text-xl"><i className="fas fa-phone"></i></button>}
                                    <button onClick={(e) => { e.stopPropagation(); endCall(); }} className="w-16 h-16 bg-red-500 rounded-full flex items-center justify-center text-xl"><i className="fas fa-phone-slash"></i></button>
                                </div>
                            </div>
                        )}

                        <div className="bg-neutral-900 p-4 pt-10 flex items-center justify-between border-b border-neutral-800">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold">M</div>
                                <div><div className="text-white font-medium">My Love</div><div className="text-xs text-green-500">Online</div></div>
                            </div>
                            <div className="flex items-center gap-5 text-xl text-blue-500 pr-2">
                                <button onClick={(e) => { e.stopPropagation(); startCall('Audio'); }} className="p-1"><i className="fas fa-phone"></i></button>
                                <button onClick={(e) => { e.stopPropagation(); startCall('Video'); }} className="p-1"><i className="fas fa-video"></i></button>
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto p-4 space-y-3">
                            {messages.map((msg, idx) => (
                                <div key={idx} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                                    <div className={`max-w-[75%] px-4 py-2 rounded-2xl ${msg.sender === 'user' ? 'bg-blue-600 text-white rounded-br-sm' : 'bg-neutral-800 text-white rounded-bl-sm'}`}>
                                        {msg.content}
                                    </div>
                                </div>
                            ))}
                            <div ref={chatEndRef} />
                        </div>

                        <div className="p-4 bg-neutral-900 border-t border-neutral-800 pb-8">
                            <div onClick={(e) => e.stopPropagation()} onDoubleClick={(e) => e.stopPropagation()} className="flex items-center gap-2">
                                <input type="text" value={messageInput} onChange={(e) => setMessageInput(e.target.value)} placeholder="Message..." className="flex-1 bg-neutral-800 text-white px-4 py-2.5 rounded-full focus:outline-none" />
                                <button onClick={sendMessage} className="w-11 h-11 rounded-full bg-blue-600 flex items-center justify-center text-white">
                                    <i className="fas fa-paper-plane"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
