<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Calculator</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        /* Strict Mobile App Styling */
        html, body { 
            margin: 0; padding: 0; 
            width: 100%; height: 100%; 
            background-color: black; 
            overflow: hidden; /* No scrolling */
            touch-action: none; /* No pinch zoom */
            -webkit-user-select: none; /* No text selection */
            user-select: none;
        }
        #root { width: 100%; height: 100%; }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .animate-shake { animation: shake 0.3s ease-in-out; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [screen, setScreen] = useState('password');
            const [password, setPassword] = useState('');
            const [passwordError, setPasswordError] = useState(false);
            
            // Fixed Calculator State
            const [display, setDisplay] = useState('0');
            const [prevValue, setPrevValue] = useState(null);
            const [operator, setOperator] = useState(null);
            const [waitingForNewValue, setWaitingForNewValue] = useState(false);
            
            // Chat State
            const [messages, setMessages] = useState([
                { sender: 'user', content: 'Chat active! Server link connect karna baaki hai.' }
            ]);
            const [messageInput, setMessageInput] = useState('');
            const [callState, setCallState] = useState(null);
            const localVideoRef = useRef(null);
            const localStream = useRef(null);

            // --- Password Logic ---
            const handlePasswordSubmit = (e) => {
                e.preventDefault();
                if (password === "jaan") { // Yahan apna password set karein
                    setScreen('calculator');
                    setPasswordError(false);
                } else {
                    setPasswordError(true);
                    setPassword('');
                    setTimeout(() => setPasswordError(false), 500);
                }
            };

            // --- Calculator Logic ---
            const inputDigit = (digit) => {
                if (waitingForNewValue) {
                    setDisplay(String(digit));
                    setWaitingForNewValue(false);
                } else {
                    setDisplay(display === '0' ? String(digit) : display + String(digit));
                }
            };

            const inputDot = () => {
                if (waitingForNewValue) {
                    setDisplay('0.');
                    setWaitingForNewValue(false);
                } else if (!display.includes('.')) {
                    setDisplay(display + '.');
                }
            };

            const clear = () => {
                setDisplay('0'); setPrevValue(null); setOperator(null); setWaitingForNewValue(false);
            };

            const performOperation = (nextOperator) => {
                const inputValue = parseFloat(display);
                
                if (prevValue === null) {
                    setPrevValue(inputValue);
                } else if (operator) {
                    const currentValue = prevValue || 0;
                    let newValue = currentValue;
                    
                    if (operator === '+') newValue += inputValue;
                    if (operator === '-') newValue -= inputValue;
                    if (operator === '×') newValue *= inputValue;
                    if (operator === '÷') newValue /= inputValue;
                    
                    setPrevValue(newValue);
                    setDisplay(String(newValue));
                }
                
                setWaitingForNewValue(true);
                setOperator(nextOperator);
            };

            const handleEquals = () => {
                // Secret Code Check
                if (display === '143') {
                    setScreen('chat');
                    clear();
                    return;
                }
                
                performOperation(null);
                setPrevValue(null);
            };

            // --- Chat & Call Logic ---
            const sendMessage = () => {
                if (!messageInput.trim()) return;
                setMessages([...messages, { sender: 'admin', content: messageInput }]);
                setMessageInput('');
            };

            const startCall = async (isVideoCall) => {
                try {
                    localStream.current = await navigator.mediaDevices.getUserMedia({ audio: true, video: isVideoCall });
                    setCallState(isVideoCall ? 'video' : 'audio');
                    setTimeout(() => {
                        if (localVideoRef.current) localVideoRef.current.srcObject = localStream.current;
                    }, 100);
                } catch (error) {
                    alert('Camera/Mic access required!');
                }
            };

            const endCall = () => {
                if (localStream.current) {
                    localStream.current.getTracks().forEach((track) => track.stop());
                    localStream.current = null;
                }
                setCallState(null);
            };

            // Return to calculator on double tap
            const handleDoubleClick = () => {
                endCall();
                setScreen('calculator');
            };

            // --- SCREENS ---
            if (screen === 'password') {
                return (
                    <div className="h-full w-full bg-black flex items-center justify-center">
                        <form onSubmit={handlePasswordSubmit} className="flex flex-col items-center gap-6">
                            <i className="fas fa-lock text-5xl text-neutral-600"></i>
                            <input type="password" value={password} onChange={(e) => setPassword(e.target.value)}
                                className={`bg-transparent border-b text-white text-center text-2xl px-4 py-2 focus:outline-none transition-all ${passwordError ? 'border-red-500 animate-shake' : 'border-neutral-800'}`}
                                placeholder="Passcode" autoFocus />
                        </form>
                    </div>
                );
            }

            if (screen === 'calculator') {
                return (
                    <div className="h-full w-full bg-black flex flex-col justify-end p-4 pb-10 max-w-sm mx-auto">
                        <div className="text-white text-7xl font-light text-right mb-6 px-4 truncate">{display}</div>
                        
                        {/* Aspect-square ensures perfect circles that auto-resize based on screen width */}
                        <div className="grid grid-cols-4 gap-3 w-full">
                            <button onClick={clear} className="bg-neutral-400 text-black text-3xl font-normal aspect-square rounded-full flex items-center justify-center active:bg-neutral-300">AC</button>
                            <button onClick={() => setDisplay(String(parseFloat(display) * -1))} className="bg-neutral-400 text-black text-3xl font-normal aspect-square rounded-full flex items-center justify-center active:bg-neutral-300">±</button>
                            <button onClick={() => setDisplay(String(parseFloat(display) / 100))} className="bg-neutral-400 text-black text-3xl font-normal aspect-square rounded-full flex items-center justify-center active:bg-neutral-300">%</button>
                            <button onClick={() => performOperation('÷')} className="bg-orange-500 text-white text-4xl font-normal aspect-square rounded-full flex items-center justify-center active:bg-orange-400">÷</button>
                            
                            {[7, 8, 9].map(num => <button key={num} onClick={() => inputDigit(num)} className="bg-neutral-800 text-white text-3xl font-normal aspect-square rounded-full flex items-center justify-center active:bg-neutral-600">{num}</button>)}
                            <button onClick={() => performOperation('×')} className="bg-orange-500 text-white text-4xl font-normal aspect-square rounded-full flex items-center justify-center active:bg-orange-400">×</button>
                            
                            {[4, 5, 6].map(num => <button key={num} onClick={() => inputDigit(num)} className="bg-neutral-800 text-white text-3xl font-normal aspect-square rounded-full flex items-center justify-center active:bg-neutral-600">{num}</button>)}
                            <button onClick={() => performOperation('-')} className="bg-orange-500 text-white text-4xl font-normal aspect-square rounded-full flex items-center justify-center active:bg-orange-400">−</button>
                            
                            {[1, 2, 3].map(num => <button key={num} onClick={() => inputDigit(num)} className="bg-neutral-800 text-white text-3xl font-normal aspect-square rounded-full flex items-center justify-center active:bg-neutral-600">{num}</button>)}
                            <button onClick={() => performOperation('+')} className="bg-orange-500 text-white text-4xl font-normal aspect-square rounded-full flex items-center justify-center active:bg-orange-400">+</button>
                            
                            <button onClick={() => inputDigit(0)} className="bg-neutral-800 text-white text-3xl font-normal rounded-full flex items-center justify-start pl-8 col-span-2 active:bg-neutral-600">0</button>
                            <button onClick={inputDot} className="bg-neutral-800 text-white text-3xl font-normal aspect-square rounded-full flex items-center justify-center active:bg-neutral-600">.</button>
                            <button onClick={handleEquals} className="bg-orange-500 text-white text-4xl font-normal aspect-square rounded-full flex items-center justify-center active:bg-orange-400">=</button>
                        </div>
                    </div>
                );
            }

            if (screen === 'chat') {
                return (
                    <div className="h-full w-full bg-black flex flex-col relative" onDoubleClick={handleDoubleClick}>
                        {callState ? (
                            <div className="absolute inset-0 z-10 bg-black">
                                <video ref={localVideoRef} autoPlay playsInline muted className="w-full h-full object-cover" />
                                <div className="absolute bottom-10 left-1/2 transform -translate-x-1/2 flex gap-4 bg-black/40 backdrop-blur-xl px-6 py-4 rounded-full">
                                    <button onClick={endCall} className="w-16 h-16 rounded-full bg-red-500 flex items-center justify-center">
                                        <i className="fas fa-phone-slash text-2xl text-white"></i>
                                    </button>
                                </div>
                            </div>
                        ) : null}

                        <div className="bg-neutral-900 p-4 pt-10 flex items-center justify-between border-b border-neutral-800 z-0">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-full bg-pink-600 flex items-center justify-center text-white font-bold">M</div>
                                <div>
                                    <div className="text-white font-medium">My Love</div>
                                    <div className="text-xs text-green-500">Ready</div>
                                </div>
                            </div>
                            <div className="flex gap-3">
                                <button onClick={() => startCall(false)} className="w-10 h-10 rounded-full bg-neutral-800 flex items-center justify-center"><i className="fas fa-phone text-white"></i></button>
                                <button onClick={() => startCall(true)} className="w-10 h-10 rounded-full bg-neutral-800 flex items-center justify-center"><i className="fas fa-video text-white"></i></button>
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto p-4 space-y-3 z-0">
                            {messages.map((msg, idx) => (
                                <div key={idx} className={`flex ${msg.sender === 'admin' ? 'justify-end' : 'justify-start'}`}>
                                    <div className={`max-w-[75%] px-4 py-2 rounded-2xl ${msg.sender === 'admin' ? 'bg-blue-600 text-white rounded-br-sm' : 'bg-neutral-800 text-white rounded-bl-sm'}`}>
                                        {msg.content}
                                    </div>
                                </div>
                            ))}
                        </div>

                        <div className="p-4 bg-neutral-900 border-t border-neutral-800 pb-8 z-0">
                            <div className="flex gap-2">
                                <input type="text" value={messageInput} onChange={(e) => setMessageInput(e.target.value)}
                                    placeholder="Message..." className="flex-1 bg-neutral-800 text-white px-4 py-3 rounded-full focus:outline-none" />
                                <button onClick={sendMessage} className="w-12 h-12 rounded-full bg-blue-600 flex items-center justify-center">
                                    <i className="fas fa-paper-plane text-white"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
