<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <title>Calculator</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: black; overflow: hidden; touch-action: none; user-select: none; }
        #root { width: 100%; height: 100%; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .animate-shake { animation: shake 0.3s ease-in-out; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const firebaseConfig = {
          apiKey: "AIzaSyBHnQxGTZXvSlJj77TWGFJLpPRQm6n_xOU",
          authDomain: "msg-jaan.firebaseapp.com",
          databaseURL: "https://msg-jaan-default-rtdb.firebaseio.com",
          projectId: "msg-jaan",
          storageBucket: "msg-jaan.firebasestorage.app",
          messagingSenderId: "188484227989",
          appId: "1:188484227989:web:9e4ddf981d8f71a3ea9c9c",
          measurementId: "G-PTDBD416S6"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        const { useState, useEffect, useRef } = React;

        function App() {
            const [screen, setScreen] = useState('password');
            const [password, setPassword] = useState('');
            const [passwordError, setPasswordError] = useState(false);
            
            const [display, setDisplay] = useState('0');
            const [prevValue, setPrevValue] = useState(null);
            const [operator, setOperator] = useState(null);
            const [waitingForNewValue, setWaitingForNewValue] = useState(false);
            
            const [messages, setMessages] = useState([]);
            const [messageInput, setMessageInput] = useState('');
            const chatEndRef = useRef(null);
            const lastTap = useRef(0);

            useEffect(() => {
                if (screen === 'chat') {
                    const messagesRef = db.ref('messages');
                    messagesRef.on('value', (snapshot) => {
                        const data = snapshot.val();
                        if (data) {
                            const list = Object.keys(data).map(key => data[key]);
                            setMessages(list);
                        }
                    });
                    return () => messagesRef.off();
                }
            }, [screen]);

            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
            }, [messages]);

            const handlePasswordSubmit = (e) => {
                e.preventDefault();
                if (password === "jaan") {
                    setScreen('calculator');
                    setPasswordError(false);
                } else {
                    setPasswordError(true);
                    setPassword('');
                    setTimeout(() => setPasswordError(false), 500);
                }
            };

            const inputDigit = (digit) => {
                if (waitingForNewValue) {
                    setDisplay(String(digit));
                    setWaitingForNewValue(false);
                } else {
                    setDisplay(display === '0' ? String(digit) : display + String(digit));
                }
            };

            const inputDot = () => {
                if (waitingForNewValue) { setDisplay('0.'); setWaitingForNewValue(false); }
                else if (!display.includes('.')) setDisplay(display + '.');
            };

            const clear = () => { setDisplay('0'); setPrevValue(null); setOperator(null); setWaitingForNewValue(false); };

            const performOperation = (nextOperator) => {
                const inputValue = parseFloat(display);
                if (prevValue === null) {
                    setPrevValue(inputValue);
                } else if (operator) {
                    const currentValue = prevValue || 0;
                    let newValue = currentValue;
                    if (operator === '+') newValue += inputValue;
                    if (operator === '-') newValue -= inputValue;
                    if (operator === '×') newValue *= inputValue;
                    if (operator === '÷') newValue /= inputValue;
                    setPrevValue(newValue);
                    setDisplay(String(newValue));
                }
                setWaitingForNewValue(true);
                setOperator(nextOperator);
            };

            const handleEquals = () => {
                if (display === '143') {
                    setScreen('chat');
                    clear();
                    return;
                }
                performOperation(null);
                setPrevValue(null);
            };

            const sendMessage = () => {
                if (!messageInput.trim()) return;
                db.ref('messages').push({
                    sender: 'user',
                    content: messageInput,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
                setMessageInput('');
            };

            // Double Tap Control Fixed (Ab background par 2 baar dabaoge tabhi calculator khulega)
            const handleDoubleTap = (e) => {
                if (e.target.closest('button') || e.target.closest('input')) return;
                
                const now = Date.now();
                const DOUBLE_PRESS_DELAY = 300;
                if (now - lastTap.current < DOUBLE_PRESS_DELAY) {
                    setScreen('calculator');
                }
                lastTap.current = now;
            };

            const handleActionAlert = (type) => {
                alert(`${type} feature is connecting...`);
            };

            if (screen === 'password') {
                return (
                    <div className="h-full w-full bg-black flex items-center justify-center">
                        <form onSubmit={handlePasswordSubmit} className="flex flex-col items-center gap-6">
                            <i className="fas fa-lock text-5xl text-neutral-600"></i>
                            <input type="password" value={password} onChange={(e) => setPassword(e.target.value)}
                                className={`bg-transparent border-b text-white text-center text-2xl px-4 py-2 focus:outline-none transition-all ${passwordError ? 'border-red-500 animate-shake' : 'border-neutral-800'}`}
                                placeholder="Passcode" autoFocus />
                        </form>
                    </div>
                );
            }

            if (screen === 'calculator') {
                return (
                    <div className="h-full w-full bg-black flex flex-col justify-end p-4 pb-10 max-w-sm mx-auto">
                        <div className="text-white text-7xl font-light text-right mb-6 px-4 truncate">{display}</div>
                        <div className="grid grid-cols-4 gap-3 w-full">
                            <button onClick={clear} className="bg-neutral-400 text-black text-3xl font-normal aspect-square rounded-full flex items-center justify-center active:bg-neutral-300">AC</button>
                            <button onClick={() => setDisplay(String(parseFloat(display) * -1))} className="bg-neutral-400 text-black text-3xl font-normal aspect-square rounded-full flex items-center justify-center active:bg-neutral-300">±</button>
                            <button onClick={() => setDisplay(String(parseFloat(display) / 100))} className="bg-neutral-400 text-black text-3xl font-normal aspect-square rounded-full flex items-center justify-center active:bg-neutral-300">%</button>
                            <button onClick={() => performOperation('÷')} className="bg-orange-500 text-white text-4xl font-normal aspect-square rounded-full flex items-center justify-center active:bg-orange-400">÷</button>
                            
                            {[7, 8, 9].map(num => <button key={num} onClick={() => inputDigit(num)} className="bg-neutral-800 text-white text-3xl font-normal aspect-square rounded-full flex items-center justify-center active:bg-neutral-600">{num}</button>)}
                            <button onClick={() => performOperation('×')} className="bg-orange-500 text-white text-4xl font-normal aspect-square rounded-full flex items-center justify-center active:bg-orange-400">×</button>
                            
                            {[4, 5, 6].map(num => <button key={num} onClick={() => inputDigit(num)} className="bg-neutral-800 text-white text-3xl font-normal aspect-square rounded-full flex items-center justify-center active:bg-neutral-600">{num}</button>)}
                            <button onClick={() => performOperation('-')} className="bg-orange-500 text-white text-4xl font-normal aspect-square rounded-full flex items-center justify-center active:bg-orange-400">−</button>
                            
                            {[1, 2, 3].map(num => <button key={num} onClick={() => inputDigit(num)} className="bg-neutral-800 text-white text-3xl font-normal aspect-square rounded-full flex items-center justify-center active:bg-neutral-600">{num}</button>)}
                            <button onClick={() => performOperation('+')} className="bg-orange-500 text-white text-4xl font-normal aspect-square rounded-full flex items-center justify-center active:bg-orange-400">+</button>
                            
                            <button onClick={() => inputDigit(0)} className="bg-neutral-800 text-white text-3xl font-normal rounded-full flex items-center justify-start pl-8 col-span-2 active:bg-neutral-600">0</button>
                            <button onClick={inputDot} className="bg-neutral-800 text-white text-3xl font-normal aspect-square rounded-full flex items-center justify-center active:bg-neutral-600">.</button>
                            <button onClick={handleEquals} className="bg-orange-500 text-white text-4xl font-normal aspect-square rounded-full flex items-center justify-center active:bg-orange-400">=</button>
                        </div>
                    </div>
                );
            }

            if (screen === 'chat') {
                return (
                    <div className="h-full w-full bg-black flex flex-col relative" onTouchStart={handleDoubleTap} onClick={handleDoubleTap}>
                        {/* Top Bar with Audio & Video Call Icons */}
                        <div className="bg-neutral-900 p-4 pt-10 flex items-center justify-between border-b border-neutral-800">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold">M</div>
                                <div>
                                    <div className="text-white font-medium">My Love</div>
                                    <div className="text-xs text-green-500">Online</div>
                                </div>
                            </div>
                            <div className="flex items-center gap-5 text-xl text-blue-500 pr-2">
                                <button onClick={() => handleActionAlert('Audio Call')} className="p-1 hover:text-blue-400"><i className="fas fa-phone"></i></button>
                                <button onClick={() => handleActionAlert('Video Call')} className="p-1 hover:text-blue-400"><i className="fas fa-video"></i></button>
                            </div>
                        </div>

                        {/* Messages Box */}
                        <div className="flex-1 overflow-y-auto p-4 space-y-3">
                            {messages.map((msg, idx) => (
                                <div key={idx} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                                    <div className={`max-w-[75%] px-4 py-2 rounded-2xl ${msg.sender === 'user' ? 'bg-blue-600 text-white rounded-br-sm' : 'bg-neutral-800 text-white rounded-bl-sm'}`}>
                                        {msg.content}
                                    </div>
                                </div>
                            ))}
                            <div ref={chatEndRef} />
                        </div>

                        {/* Bottom Input with Photo Upload Icon */}
                        <div className="p-4 bg-neutral-900 border-t border-neutral-800 pb-8">
                            <div className="flex items-center gap-2">
                                <button onClick={() => handleActionAlert('Photo Upload')} className="w-10 h-10 rounded-full bg-neutral-800 flex items-center justify-center text-neutral-400 hover:text-white">
                                    <i className="fas fa-camera text-lg"></i>
                                </button>
                                <input type="text" value={messageInput} onChange={(e) => setMessageInput(e.target.value)}
                                    placeholder="Message..." className="flex-1 bg-neutral-800 text-white px-4 py-2.5 rounded-full focus:outline-none" />
                                <button onClick={sendMessage} className="w-11 h-11 rounded-full bg-blue-600 flex items-center justify-center text-white">
                                    <i className="fas fa-paper-plane"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
