<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sumi ke liye Surprise</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;600&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #05010a; /* Ultra Dark background */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            perspective: 1000px; /* For 3D feel */
        }

        #uiCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        /* Screen 1: Password */
        #passwordScreen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 1.5s ease-out;
        }

        .neon-title {
            font-family: 'Dancing Script', cursive;
            font-size: 5rem;
            color: #fff;
            text-align: center;
            text-shadow:
                0 0 7px #fff,
                0 0 10px #fff,
                0 0 21px #fff,
                0 0 42px #ff00de, /* Pink Neon */
                0 0 82px #ff00de,
                0 0 92px #ff00de,
                0 0 102px #ff00de,
                0 0 151px #ff00de;
            animation: pulsate 1.5s infinite alternate, flickInput 3s infinite;
            margin-bottom: 2rem;
        }

        @keyframes flickInput {
            0%, 18%, 22%, 25%, 53%, 57%, 100% {
                text-shadow: 0 0 7px #fff, 0 0 10px #fff, 0 0 21px #fff, 0 0 42px #ff00de, 0 0 82px #ff00de, 0 0 92px #ff00de, 0 0 102px #ff00de, 0 0 151px #ff00de;
            }
            20%, 24%, 55% {
                text-shadow: none;
                opacity: 0.8;
            }
        }

        #passwordField {
            background: none;
            border: 2px solid #ff00de;
            border-radius: 25px;
            padding: 15px 25px;
            color: #fff;
            font-size: 1.5rem;
            text-align: center;
            width: 300px;
            box-shadow: 0 0 15px rgba(255, 0, 222, 0.7);
            outline: none;
            transition: box-shadow 0.3s;
        }

        #passwordField:focus {
            box-shadow: 0 0 30px rgba(255, 0, 222, 1);
        }

        .neon-btn {
            margin-top: 1.5rem;
            background: none;
            border: 2px solid #00f7ff; /* Blue Neon */
            border-radius: 25px;
            color: #00f7ff;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 1.2rem;
            padding: 10px 30px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #00f7ff;
            box-shadow: 0 0 15px rgba(0, 247, 255, 0.5);
            transition: all 0.3s ease;
        }

        .neon-btn:hover {
            background: #00f7ff;
            color: #05010a;
            box-shadow: 0 0 40px rgba(0, 247, 255, 1);
        }

        /* Screen 2: Flower */
        #flowerScreen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            z-index: 10;
            transition: opacity 1.5s ease-in;
        }

        #neonHibiscus {
            font-size: 10rem;
            cursor: pointer;
            color: #ff3366; /* Realistic Hibiscus Red */
            text-shadow:
                0 0 10px #ff3366,
                0 0 20px #ff3366,
                0 0 40px #ff3366,
                0 0 80px #ff0044; /* Darker Red halo */
            animation: hibiscusFloat 4s ease-in-out infinite, hibiscusPulsate 2s infinite alternate;
            transition: transform 0.2s ease-out, filter 0.2s ease-out;
        }

        #neonHibiscus:hover {
            filter: brightness(1.3);
            transform: scale(1.1) rotate(5deg);
        }

        @keyframes hibiscusFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(3deg); }
        }

        @keyframes hibiscusPulsate {
            0% { text-shadow: 0 0 10px #ff3366, 0 0 20px #ff3366, 0 0 40px #ff3366, 0 0 80px #ff0044; }
            100% { text-shadow: 0 0 15px #ff3366, 0 0 30px #ff3366, 0 0 60px #ff3366, 0 0 120px #ff0044; }
        }

        /* Screen 3: Boom! */
        #boomScreen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            z-index: 10;
            transition: opacity 0.5s ease-in;
        }

        #proposeText {
            font-family: 'Dancing Script', cursive;
            font-size: 6rem;
            color: #fff;
            text-align: center;
            line-height: 1.2;
            text-shadow:
                0 0 7px #fff,
                0 0 10px #fff,
                0 0 21px #fff,
                0 0 42px #ff0000, /* Deep Red Neon */
                0 0 82px #ff0000,
                0 0 92px #ff0000,
                0 0 102px #ff0000;
            animation: textReveal 1.5s ease-out forwards;
            opacity: 0;
            transform: scale(0.5);
        }

        @keyframes textReveal {
            0% { opacity: 0; transform: scale(0.5) rotate(-5deg); }
            70% { opacity: 1; transform: scale(1.05) rotate(2deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        /* Utillity */
        .fade-out { opacity: 0 !important; pointer-events: none; }
        .fade-in { opacity: 1 !important; pointer-events: auto !important; }

    </style>
</head>
<body>

    <canvas id="uiCanvas"></canvas>

    <!-- Screen 1: Password -->
    <div id="passwordScreen">
        <h1 class="neon-title">Enter our code, Sumi...</h1>
        <input type="text" id="passwordField" placeholder="?????" maxlength="9">
        <button class="neon-btn" onclick="checkPassword()">Unlock</button>
    </div>

    <!-- Screen 2: Flower -->
    <div id="flowerScreen">
        <div id="neonHibiscus" onclick="triggerBoom()">🌺</div>
    </div>

    <!-- Screen 3: Boom! -->
    <div id="boomScreen">
        <h1 id="proposeText">I love you<br>Sumi darling</h1>
    </div>

    <script>
        const canvas = document.getElementById('uiCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let hearts = [];
        let animationFrameId;

        // Realistic Neon Particles
        class Heart {
            constructor(x, y, color, speed, size) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.baseColor = color;
                this.speed = speed;
                this.size = size;
                this.angle = Math.random() * Math.PI * 2;
                this.spin = (Math.random() - 0.5) * 0.1;
                this.decay = 0.96 + Math.random() * 0.03;
                this.alpha = 1;
                this.blur = 15 + Math.random() * 10;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                // Neon Glow Effect (Layered shadows)
                ctx.shadowColor = this.baseColor;
                ctx.shadowBlur = this.blur * this.alpha; // Glow scales with fade
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 0;

                ctx.fillStyle = '#fff'; // White core for realistic neon
                ctx.beginPath();
                // Classic heart path
                const s = this.size * this.alpha;
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(-s / 2, -s / 2, -s, 0, 0, s);
                ctx.bezierCurveTo(s, 0, s / 2, -s / 2, 0, 0);
                ctx.fill();

                // Secondary Glow layer
                ctx.shadowBlur = this.blur * 2 * this.alpha;
                ctx.fillStyle = this.color;
                ctx.fill();

                ctx.restore();
            }

            update() {
                // Move based on blast physics
                this.x += Math.cos(this.angle) * this.speed * this.alpha;
                this.y += Math.sin(this.angle) * this.speed * this.alpha + 0.5; // Slight gravity
                this.angle += this.spin * this.alpha;
                this.alpha *= this.decay; // Fade out
            }
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 1. Check Password
        function checkPassword() {
            const pass = document.getElementById('passwordField').value.toLowerCase().trim();
            if (pass === 'i love you') {
                transitionToFlower();
            } else {
                // Flash red on wrong password
                const input = document.getElementById('passwordField');
                input.style.borderColor = '#ff0000';
                input.style.boxShadow = '0 0 30px #ff0000';
                setTimeout(() => {
                    input.style.borderColor = '#ff00de';
                    input.style.boxShadow = '0 0 15px rgba(255, 0, 222, 0.7)';
                }, 500);
            }
        }

        // Allow 'Enter' key
        document.getElementById('passwordField').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });

        // 2. Transition S1 -> S2
        function transitionToFlower() {
            document.getElementById('passwordScreen').classList.add('fade-out');
            setTimeout(() => {
                document.getElementById('passwordScreen').style.display = 'none';
                document.getElementById('flowerScreen').classList.add('fade-in');
            }, 1500);
        }

        // 3. Transition S2 -> S3 (THE BOOM)
        function triggerBoom() {
            document.getElementById('flowerScreen').classList.add('fade-out');
            
            // Create the Blast Particles
            createBlast(width / 2, height / 2);

            setTimeout(() => {
                document.getElementById('flowerScreen').style.display = 'none';
                document.getElementById('boomScreen').classList.add('fade-in');
            }, 300); // Quick transition after click
        }

        function createBlast(startX, startY) {
            hearts = [];
            const particleCount = 150;
            const colors = ['#ff00de', '#ff3366', '#ff0000', '#00f7ff']; // Neon Pink, Red, Blue

            for (let i = 0; i < particleCount; i++) {
                const color = colors[Math.floor(Math.random() * colors.length)];
                const speed = 10 + Math.random() * 25; // Explosive speed
                const size = 15 + Math.random() * 20;
                hearts.push(new Heart(startX, startY, color, speed, size));
            }

            if (!animationFrameId) {
                animate();
            }
        }

        function animate() {
            // Realistic trails
            ctx.fillStyle = 'rgba(5, 1, 10, 0.3)'; 
            ctx.fillRect(0, 0, width, height);

            for (let i = hearts.length - 1; i >= 0; i--) {
                hearts[i].update();
                hearts[i].draw();

                if (hearts[i].alpha < 0.01) {
                    hearts.splice(i, 1);
                }
            }

            if (hearts.length > 0) {
                animationFrameId = requestAnimationFrame(animate);
            } else {
                animationFrameId = null;
                // Optional: Clear canvas fully after animation ends
                ctx.clearRect(0, 0, width, height);
            }
        }

    </script>
</body>
</html>
